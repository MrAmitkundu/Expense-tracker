<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Welcome to Expense Tracker </title>
</head>

<body>
    <main id="add_main">

        <div id="index_nav">
            <div id="index_nav_left" class="index_nav_format">
                <div id="index_nav_left_content"> Hisab Rakho 2.0</div>
            </div>
            <div id="index_nav_right" class="index_nav_format">
                <ul id="index_nav_right_ul">
                    <li class="index_nav_right_li"><a href="/index.html">Home</a></li>
                    <li class="index_nav_right_li"><a href="/add.html">Add</a></li>
                    <li class="index_nav_right_li"><a href="/view.html">View</a></li>
                    <li class="index_nav_right_li"><a href="/edit.html">Edit</a></li>
                    <li class="index_nav_right_li"><a href="/about.html">About</a></li>
                </ul>
            </div>
        </div>

        <div id="add_main_div">
            <div id="add_main_div_form_outer">
                <h1>ADD INCOME or EXPENSES</h1>

                <form action="">

                    <label for="" id="add_label_date" class="label_name">Choose The Date</label>
                    <input type="date" id="add_input_date" class="form_placeholder">

                    <label for="" id="add_label_select" class="label_name">Choose From The List</label>
                    <select name="" id="add_select" class="form_placeholder">
                        <option value="">Money Withdrawl</option>
                        <option value="">Vegetables</option>
                        <option value="">Grocery</option>
                        <option value="">Family expense</option>
                        <option value="">Others</option>
                    </select>

                    <label for="" id="add_label_amount" class="label_name">Enter The Amount</label>
                    <input type="number" id="add_input_amount" class="form_placeholder">

                    <label for="" id="add_label_textarea" class="label_name">Enter The Description</label>
                    <textarea name="" id="add_textarea" rows="5" placeholder="Enter The description here "></textarea>

                    
                </form>

                <div id="add_div_button">
                        <button id="add_button">ADD</button>
                    </div>
            </div>
        </div>

        <div id="index_footer"></div>
    </main>
</body>

</html>
